name: Production operational email alerts migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://tkyopolcxfsdbhvrgadj.supabase.co"
          case "$SUPABASE_DB_URL" in
            *tkyopolcxfsdbhvrgadj*supabase.com*) ;;
            *) echo "SUPABASE_DB_URL não aponta para o projeto RankFTV de produção." >&2; exit 1 ;;
          esac

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17

      - name: Apply operational email alerts migration atomically
        shell: bash
        run: |
          set -euo pipefail
          pg17_bin="/usr/lib/postgresql/17/bin"
          test -x "$pg17_bin/psql"
          "$pg17_bin/psql" \
            --dbname="$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file=supabase/production-operational-email-alerts.sql

      - name: Verify required production objects and protections
        shell: bash
        run: |
          set -euo pipefail
          pg17_bin="/usr/lib/postgresql/17/bin"
          result="$($pg17_bin/psql \
            --dbname="$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --command="SELECT
              (
                SELECT count(*) = 3
                FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'operational_alert_settings'
                  AND column_name IN (
                    'email_queue_enabled',
                    'email_queue_minutes',
                    'email_queue_backlog_threshold'
                  )
              )
              AND EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conname = 'operational_alert_settings_email_queue_minutes_check'
                  AND conrelid = 'public.operational_alert_settings'::regclass
              )
              AND EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conname = 'operational_alert_settings_email_queue_threshold_check'
                  AND conrelid = 'public.operational_alert_settings'::regclass
              )
              AND to_regclass('public.championship_notice_deliveries_alert_queue_idx') IS NOT NULL
              AND to_regclass('public.organizer_financial_notification_alert_queue_idx') IS NOT NULL
              AND (
                SELECT relrowsecurity
                FROM pg_class
                WHERE oid = 'public.operational_alerts'::regclass
              )
              AND NOT has_table_privilege('anon', 'public.operational_alerts', 'SELECT')
              AND NOT has_table_privilege('authenticated', 'public.operational_alerts', 'SELECT');")"
          test "$result" = "t"
