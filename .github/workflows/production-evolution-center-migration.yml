name: Production evolution center migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://tkyopolcxfsdbhvrgadj.supabase.co"
          case "$SUPABASE_DB_URL" in
            *tkyopolcxfsdbhvrgadj*supabase.com*) ;;
            *) echo "SUPABASE_DB_URL não aponta para o projeto RankFTV de produção." >&2; exit 1 ;;
          esac

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17

      - name: Verify dependencies before migration
        shell: bash
        run: |
          set -euo pipefail
          pg17_bin="/usr/lib/postgresql/17/bin"
          result="$($pg17_bin/psql --dbname="$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT to_regclass('public.yt_ideas') IS NOT NULL;")"
          test "$result" = "t"

      - name: Apply evolution center atomically
        shell: bash
        run: |
          set -euo pipefail
          pg17_bin="/usr/lib/postgresql/17/bin"
          migration="$RUNNER_TEMP/evolution-center-production.sql"
          cat supabase/evolution-center.sql \
              supabase/20261021000100_evolution_ai_jobs.sql \
              supabase/20261026000100_youtube_article_summaries.sql \
              supabase/20261026000200_seed_manual_article_summaries.sql > "$migration"
          "$pg17_bin/psql" \
            --dbname="$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file="$migration"

      - name: Reapply public schema client hardening
        shell: bash
        run: |
          set -euo pipefail
          pg17_bin="/usr/lib/postgresql/17/bin"
          "$pg17_bin/psql" \
            --dbname="$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file=supabase/production-security-20-point-hardening.sql

      - name: Verify private tables, policies and worker RPC
        shell: bash
        run: |
          set -euo pipefail
          pg17_bin="/usr/lib/postgresql/17/bin"
          psql_bool() {
            "$pg17_bin/psql" \
              --dbname="$SUPABASE_DB_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command="$1"
          }

          table_count="$(psql_bool "WITH expected(name) AS (VALUES
            ('evo_settings'), ('evo_study_sessions'), ('evo_roadmap_progress'),
            ('evo_training_logs'), ('evo_weight_logs'), ('evo_follower_snapshots'),
            ('evo_equipment'), ('evo_weekly_videos'), ('evo_project_progress'),
            ('evo_source_snapshots'), ('evo_ai_reviews'), ('evo_ai_jobs'), ('evo_ai_workers')
          ) SELECT count(*) FROM expected e WHERE to_regclass('public.' || e.name) IS NOT NULL;")"
          test "$table_count" = "13" || { echo "EVO_VERIFY_TABLE_COUNT:$table_count" >&2; exit 1; }

          protected_count="$(psql_bool "SELECT count(*) FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND left(c.relname, 4) = 'evo_'
              AND c.relkind = 'r' AND c.relrowsecurity AND c.relforcerowsecurity;")"
          test "$protected_count" = "13" || { echo "EVO_VERIFY_RLS_COUNT:$protected_count" >&2; exit 1; }

          client_grants="$(psql_bool "SELECT count(*) FROM information_schema.role_table_grants
            WHERE table_schema = 'public' AND left(table_name, 4) = 'evo_'
              AND grantee IN ('anon', 'PUBLIC');")"
          test "$client_grants" = "0" || { echo "EVO_VERIFY_ANON_GRANTS:$client_grants" >&2; exit 1; }

          worker_rpc="$(psql_bool "SELECT
            to_regprocedure('public.evo_claim_ai_job(uuid,text,text)') IS NOT NULL
            AND has_function_privilege('service_role', 'public.evo_claim_ai_job(uuid,text,text)', 'EXECUTE')
            AND NOT has_function_privilege('authenticated', 'public.evo_claim_ai_job(uuid,text,text)', 'EXECUTE');")"
          test "$worker_rpc" = "t" || { echo "EVO_VERIFY_WORKER_RPC" >&2; exit 1; }

          summary_table="$(psql_bool "SELECT to_regclass('public.yt_article_summaries') IS NOT NULL;")"
          test "$summary_table" = "t" || { echo "YT_VERIFY_ARTICLE_SUMMARIES_TABLE" >&2; exit 1; }

          summary_rls="$(psql_bool "SELECT relrowsecurity FROM pg_class WHERE oid = 'public.yt_article_summaries'::regclass;")"
          test "$summary_rls" = "t" || { echo "YT_VERIFY_ARTICLE_SUMMARIES_RLS" >&2; exit 1; }

          summary_client_grants="$(psql_bool "SELECT count(*) = 0 FROM information_schema.role_table_grants WHERE table_schema = 'public' AND table_name = 'yt_article_summaries' AND grantee IN ('anon', 'authenticated', 'PUBLIC');")"
          test "$summary_client_grants" = "t" || { echo "YT_VERIFY_ARTICLE_SUMMARIES_GRANTS" >&2; exit 1; }

          summary_count="$(psql_bool "SELECT count(*) FROM public.yt_article_summaries WHERE model = 'manual-web-research';")"
          test "$summary_count" -gt "0" || { echo "YT_VERIFY_MANUAL_SUMMARIES:$summary_count" >&2; exit 1; }
