name: Production home banners migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://tkyopolcxfsdbhvrgadj.supabase.co"
          case "$SUPABASE_DB_URL" in
            *tkyopolcxfsdbhvrgadj*supabase.com*) ;;
            *) echo "SUPABASE_DB_URL não aponta para o projeto RankFTV de produção." >&2; exit 1 ;;
          esac

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17

      - name: Apply home banners migration atomically
        shell: bash
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql \
            --dbname="$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file=supabase/home-banners.sql

      - name: Verify home_banners column and grants
        shell: bash
        run: |
          set -euo pipefail
          result="$(/usr/lib/postgresql/17/bin/psql \
            --dbname="$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --tuples-only --no-align \
            --command="SELECT
              EXISTS (
                SELECT 1 FROM information_schema.columns 
                WHERE table_name = 'platform_config' AND column_name = 'home_banners'
              )
              AND has_column_privilege('anon', 'public.platform_config', 'home_banners', 'SELECT') = true
              AND has_column_privilege('authenticated', 'public.platform_config', 'home_banners', 'SELECT') = true;")"
          test "$result" = "t"
