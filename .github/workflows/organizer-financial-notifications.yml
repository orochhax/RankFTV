name: Organizer financial notification delivery

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: organizer-financial-notification-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - name: Process pending deliveries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "X-Request-ID: github-organizer-financial-notifications-$GITHUB_RUN_ID" \
            https://www.rankftv.com/api/cron/organizer-financial-notifications

      - name: Scan operational email alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "X-Request-ID: github-operational-alerts-$GITHUB_RUN_ID" \
            https://www.rankftv.com/api/cron/operational-alerts
